<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recreando plantilla 7</title>
    <link rel="stylesheet" href="plantilla7.css" />
</head>

<body>

  <div class="barra-celeste-superior"></div>

  <div class="barras-superiores">
    <div class="barras-superiores-uno">
      <div class="linea-roja"></div>
      <div class="lineas-de-colores">
        <div class="barra-superior-uno-linea-gris-claro"></div>
        <div class="barra-superior-uno-linea-gris-oscuro"></div>
        <div class="barra-superior-uno-linea-celeste"></div>
      </div>
    </div>
    <div class="barras-superiores-dos">
      <div class="cuadrados-grises">
        <div class="cuadrado-gris"></div>
        <div class="cuadrado-gris"></div>
      </div>
      <div class="barra-blanca"></div>
      <div class="cuadrados-grises">
        <div class="cuadrado-gris"></div>
        <div class="cuadrado-gris"></div>
      </div>
    </div>
  </div>

  <div class="barras-superiores-tres">
    <div class="barras-blancas"></div>
    <div class="barras-blancas"></div>
    <div class="franja-celeste"></div>
    <div class="barras-blancas"></div>
    <div class="barras-blancas"></div>
    <div class="barras-blancas"></div>
  </div>

  <section class="medio-uno">
    <div class="rectangulo-con-lineas">
      <div class="linea-gruesa-gris"></div>  
      <div class="linea-blanca"></div>
      <div class="linea-blanca"></div>
      <div class="linea-blanca"></div>
      <div class="linea-celeste"></div>
    </div>
    <div class="multiples-lineas-rectangulo">
      <div class="linea-celeste-corta"></div>
      <div class="lineas-blancas-largas"></div>
      <div class="lineas-blancas-largas"></div>
      <div class="lineas-blancas-largas"></div>
      <div class="lineas-blancas-largas"></div>
      <div class="linea-blanca-corta"></div>
    </div>
  </section>

  <section class="medio-dos">
    <div class="linea-gris-oscuro"></div>
    <div class="lineas-grises-clarito"></div>
    <div class="lineas-grises-clarito"></div>
    <div class="linea-gris-clarito"></div>
    <div class="cuadrados-y-lineas">
      <div class="cuadrado">
        <div class="cuadrado-celeste"></div>
        <div class="cuadrado-linea-gris-oscuro"></div>
        <div class="cuadrado-lineas-grises-clarito"></div>
        <div class="cuadrado-lineas-grises-clarito"></div>
        <div class="cuadrado-linea-gris-clarito"></div>
      </div>
      <div class="cuadrado">
        <div class="cuadrado-celeste"></div>
        <div class="cuadrado-linea-gris-oscuro"></div>
        <div class="cuadrado-lineas-grises-clarito"></div>
        <div class="cuadrado-lineas-grises-clarito"></div>
        <div class="cuadrado-linea-gris-clarito"></div>
      </div>
      <div class="cuadrado">
        <div class="cuadrado-celeste"></div>
        <div class="cuadrado-linea-gris-oscuro"></div>
        <div class="cuadrado-lineas-grises-clarito"></div>
        <div class="cuadrado-lineas-grises-clarito"></div>
        <div class="cuadrado-linea-gris-clarito"></div>
      </div>
    </div>
  </section>

  <footer class="barra-gris-oscuro-final"></footer>
  
</body>
</html>
